name: Release

# A v* tag is the release. The version in main.go is the source of truth for
# what gets built; the tag is checked against it below, because the tag only
# triggers this and a mismatch would otherwise ship the wrong number.
on:
  push:
    tags: ['v*']
  # So a flaky GitHub API does not cost a version number: re-tagging to retry a
  # transient 500 is worse than re-running. `all` rebuilds the archives and moves
  # ghcr's `latest` and the tap, so it is for the NEWEST tag only. `chocolatey`
  # re-pushes that package alone, packed from this branch rather than the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to release, e.g. v0.2.0
        required: true
      channel:
        description: all, or chocolatey to re-push only that package for an existing release
        type: choice
        options: [all, chocolatey]
        default: all

permissions:
  contents: write
  packages: write

jobs:
  # Its own job so the packaging below does not depend on the GitHub release API
  # being healthy. That API returned 500 for twenty minutes on 0.2.0, and because
  # every other job hung off `needs: release`, the container image, the tap, the
  # Chocolatey package and the winget PR were all skipped over a problem that had
  # nothing to do with any of them.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.vsn.outputs.version }}
      tag: ${{ steps.vsn.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # check-versions.sh confirms each CHANGELOG.md line links a commit in
          # this tag's history, which a shallow clone does not have.
          fetch-depth: 0
      - name: Check the tag against the version in main.go
        id: vsn
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          src="$(grep -m1 'var version = ' main.go | cut -d'"' -f2)"
          if [ "${tag#v}" != "$src" ] ; then
            echo "tag ${tag} does not match main.go version ${src}" >&2
            exit 1
          fi
          echo "version=${src}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      # Every other job needs this one, so a stale version string fails the
      # release before anything is built, published or pushed to a tap.
      - name: Check every version string against the tag
        run: ./scripts/check-versions.sh "${{ steps.vsn.outputs.version }}"

  release:
    needs: version
    # Skipped by a chocolatey-only dispatch, and with it every job that needs it.
    if: github.event_name == 'push' || inputs.channel == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - run: go test ./...

      - name: Build and package
        run: ./scripts/build-archive-all.sh "${{ needs.version.outputs.version }}"

      - name: Stamp the installers with this version
        run: |
          vsn="${{ needs.version.outputs.version }}"
          sed -i "s/^VSN=\"\${VSN:-.*}\"/VSN=\"\${VSN:-${vsn}}\"/" dist/macos.sh dist/deb.sh
          sed -i "s/else { \"[0-9.]*\" }/else { \"${vsn}\" }/" dist/windows.ps1
          cp dist/macos.sh dist/deb.sh dist/windows.ps1 build/

      # The release's notes are this version's CHANGELOG.md section, which
      # check-versions.sh already required in the version job.
      - name: Cut this version's CHANGELOG.md section
        run: |
          vsn="${{ needs.version.outputs.version }}"
          notes="$RUNNER_TEMP/notes.md"
          awk -v v="$vsn" '/^## /{ if (found) exit; found = ($2 == v); next } found' CHANGELOG.md > "$notes"
          if ! grep -q '^### ' "$notes" ; then
            echo "CHANGELOG.md has no section for ${vsn}" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          files: |
            build/*.tar.gz
            build/*.zip
            build/*.deb
            build/macos.sh
            build/deb.sh
            build/windows.ps1
          body_path: ${{ runner.temp }}/notes.md

  docker:
    needs: version
    if: github.event_name == 'push' || inputs.channel == 'all'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/login-action@v3
        with:
          # ghcr rather than Docker Hub: same org, no second account to hold,
          # and the token is the one this workflow already has.
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Without this the image reports `version: dev`, because the
          # Dockerfile's ARG defaults to it and nothing was passing the real
          # one. The binary in a release archive was right and the one in the
          # container was not, which is the kind of difference nobody notices
          # until they are reading a bug report.
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/internetdata/mmdb:${{ needs.version.outputs.version }}
            ghcr.io/internetdata/mmdb:latest

  homebrew:
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update the tap formula
        env:
          TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
          VSN: ${{ needs.version.outputs.version }}
        # Skipped rather than failed when the key is absent, so a release still
        # completes on a fork.
        run: |
          if [ -z "$TAP_DEPLOY_KEY" ] ; then
            echo "::warning title=Homebrew skipped::TAP_DEPLOY_KEY is unset, so the tap formula was not updated"
            exit 0
          fi
          ./scripts/update-homebrew.sh "$VSN"

  winget:
    needs: [version, release]
    runs-on: windows-latest
    steps:
      # Unconfigured and broken are different things, and neither may be silent:
      # a skipped channel is GREEN, and `continue-on-error` used to swallow the
      # real failure underneath it.
      - id: guard
        shell: bash
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ] ; then
            echo "::warning title=winget skipped::WINGET_TOKEN is unset, so ${{ needs.version.outputs.tag }} was not submitted to winget-pkgs"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      # vedantmgoyal2009 was renamed to vedantmgoyal9; the old path only still
      # resolves through GitHub's rename redirect.
      - if: steps.guard.outputs.configured == 'true'
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: InternetData.Mmdb
          installers-regex: '_windows_\w+\.zip$'
          version: ${{ needs.version.outputs.version }}
          token: ${{ secrets.WINGET_TOKEN }}

  chocolatey:
    needs: [version, release]
    if: >-
      ${{ !cancelled() && needs.version.result == 'success' &&
      (needs.release.result == 'success' || inputs.channel == 'chocolatey') }}
    runs-on: windows-latest
    steps:
      # No ref: a tag push packs the tag's tree and a dispatch this branch's, which
      # is how a nuspec fix reaches a version moderation wants resubmitted as-is.
      - uses: actions/checkout@v7
      - name: Push the Chocolatey package
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
          VSN: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          if (-not $env:CHOCO_API_KEY) {
            Write-Host "::warning title=Chocolatey skipped::CHOCO_API_KEY is unset, so $env:VSN was not pushed to Chocolatey"
            exit 0
          }
          ./scripts/update-chocolatey.ps1 -Version $env:VSN -ApiKey $env:CHOCO_API_KEY
